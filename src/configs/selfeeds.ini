; MultiOgar configurations file
; Lines starting with semicolons are comments

; [NOTES]
; MultiOgar uses cell size instead of cell mass to improve performance!
; In order to get the cell size from mass value, you need to calculate using this formula:
;     size = SQRT( mass * 100 )
;
; For example, to set start mass = 43:
;     size = SQRT( 43 * 100 ) = SQRT( 4300 ) = 65.57
; Set playerStartSize = 66
;
; Also, you can use the following syntax to specify mass:
;     playerStartSize = massToSize(43)
; It will be automatically converted to 66

; [LOGGING]
; logVerbosity: Console log level (0=NONE; 1=FATAL; 2=ERROR; 3=WARN; 4=INFO; 5=DEBUG)
; logFileVerbosity: File log level
logVerbosity = 4
logFileVerbosity = 5

; [SERVER]
; serverTimeout: Seconds to keep connection alive for non-responding client
; serverWsModule: WebSocket module: 'ws' or 'uws' (install npm package before using uws)
; serverMaxConnections: Maximum number of connections to the server. (0 for no limit)
; serverPort: Server port which will be used to listen for incoming connections
; serverBind: Server network interface which will be used to listen for incoming connections (0.0.0.0 for all IPv4 interfaces)
; serverTracker: Set to 1 if you want to show your server on the tracker http://ogar.mivabe.nl/master (check that your server port is opened for external connections first!)
; serverGamemode: Gamemodes: 0 = FFA, 1 = Teams, 2 = Experimental, 3 = Rainbow
; serverBots: Number of player bots to spawn (Experimental)
; serverViewBase: Base view distance of players. Warning: high values may cause lag! Min value is 1920x1080
; serverMinScale: Minimum viewbox scale for player (low value leads to lags due to large visible area for big cell)
; serverSpectatorScale: Scale (field of view) used for free roam spectators (low value leads to lags, vanilla = 0.4, old vanilla = 0.25)
; serverStatsPort: Port for the stats server. Having a negative number will disable the stats server.
; serverStatsUpdate: Update interval of server stats in seconds
; mobilePhysics: Whether or not the server uses mobile agar.io physics
serverTimeout = 0
serverWsModule = "ws"
serverMaxConnections = 25
serverPort = 8085
serverBind = "0.0.0.0"
serverTracker = 0
serverGamemode = 0
serverBots = 0
serverViewBaseX = 8080
serverViewBaseY = 8080
serverMinScale = 0.15
serverSpectatorScale = 0.4
serverStatsPort = 8885
serverStatsUpdate = 5
mobilePhysics = 0
afkTimeout = 340

; [CLIENT]
; serverMaxLB: Controls the maximum players displayed on the leaderboard.
; serverChat: Allows the usage of server chat. 0 = no chat, 1 = use chat.
; serverChatAscii: Set to 1 to disable non-ANSI letters in the chat (english only)
; serverName: Server name, for example "My great server"
; serverWelcome1: First server welcome message
; serverWelcome2: Second server welcome message (optional, for info, etc)
; clientBind: Only allow connections to the server from specified client (eg: http://agar.io - http://mywebsite.com - http://more.com) [Use ' - ' to seperate different websites]
serverMaxLB = 10
serverChat = 1
serverChatAscii = 0
serverName = "Selfeed"
serverWelcome1 = "Welcome to EU Self-Feed"
serverWelcome2 = ""
clientBind = "https://aetlis.io"

; [ANTI-BOT]
; serverIpLimit: Controls the maximum number of connections from the same IP (0 for no limit)
; serverMinionIgnoreTime: minion detection disable time on server startup [seconds]
; serverMinionThreshold: max connections within serverMinionInterval time period, which will not be marked as minion
; serverMinionInterval: minion detection interval [milliseconds]
; serverScrambleLevel: Toggles scrambling of coordinates. 0 = No scrambling, 1 = lightweight scrambling. 2 = full scrambling (also known as scramble minimap), 3 - high level scrambling (no border)
; playerBotGrow: Cells greater than 625 mass cannot grow from players under 17 mass (set to 1 to disable)
serverIpLimit = 1
serverMinionIgnoreTime = 30
serverMinionThreshold = 10
serverMinionInterval = 1000
serverScrambleLevel = 0
playerBotGrow = 0


; [BORDER]
; Border size (vanilla 14142.135623730952)
; useSpatialHash: If 1, server will use a spatial hash for finding nodes. If 0, server will use quadtree instead.
; worldIsCircular: Set to 1 to enable circular/oval map instead of rectangular (0 = rectangular, 1 = circular)
; worldRadius: Radius of the circular map (OPTIONAL - auto-calculated from borderWidth/borderHeight if not set or default)
borderWidth = 45000
borderHeight = 45000
useSpatialHash = 0
worldIsCircular = 1
; worldRadius = 2255500  (Auto-calculated if commented out or default value)

; [FOOD]
; foodMinSize: vanilla 10 (mass = 10*10/100 = 1 mass)
; foodMaxSize: vanilla 20 (mass = 20*20/100 = 4 mass)
; foodAmount: Amount of food cells on the map
; foodPerMother: Maximum spawned food cells per mother cell
; foodMassGrow: Enable food mass grow ?
; spawnInterval: The interval between each food cell spawn in ticks (1 tick = 40 ms)
foodMinSize = 10
foodMaxSize = 20
foodAmount = 150
foodPerMother = 96

; [VIRUSES]
; virusMinSize: Minimum virus size. (vanilla: mass = val*val/100 = 100 mass)
; virusMaxSize: Maximum virus size (vanilla: mass = val*val/100 = 200 mass)
; virusMinAmount: Minimum number of viruses on the map.
; virusMaxAmount: Maximum number of viruses on the map. If this number is reached, then ejected cells will pass through viruses.
; motherCellMaxMass: Maximum amount of mass a mothercell is allowed to have (0 for no limit)
; virusVelocity: Velocity of moving viruses (speed and distance)
; virusPush: Enable/disable virus push when eating ejected mass (0 = disabled, 1 = enabled)
; virusPushBoost: Amount of boost added to virus per ejected mass eaten (try 100-300)
; virusMaxBoost: Maximum boost a virus can accumulate
virusMinSize = 100
virusPush = 1
virusPushBoost = 400
virusMaxBoost = 780
virusMaxSize = 141.421356237
virusMinAmount = 0
virusMaxAmount = 20
foodInvisible = 1
motherCellMaxMass = 0
virusVelocity = 780

; [EJECTED MASS]
; ejectSize: vanilla: mass = val*val/100 = 16 mass
; ejectSizeLoss: Eject size which will be substracted from player cell (vanilla: mass = val*val/100 = 20 mass?)
; ejectCooldown: Tick count until a player can eject mass again in ticks (1 tick = 40 ms)
; ejectEatDelay: Ticks before ejected mass can be eaten (0 = instant)
; ejectSpawnPercent: Chance for a player to spawn from ejected mass. 0.5 = 50% (set to 0 to disable)
; ejectVirus: Whether or not players can eject viruses instead of mass
; ejectVelocity: Velocity of ejecting cells (speed and distance)
; ejectMaxAge: Maximum age in ticks before ejected mass is automatically removed (75 ticks = 3 seconds, 0 to disable auto-removal)
ejectSize = 100
ejectSizeLoss = 96
ejectCooldown = 0.1
ejectSpawnPercent = 0
ejectVirus = 0
ejectVelocity = 780
ejectMaxAge = 75

; [PLAYERS]
; Reminder: MultiOgar uses cell size instead of mass!
;       playerStartMass replaced with playerStartSize
;
; playerMinSize: Minimum size a player cell can decay too. (vanilla: val*val/100 = 10 mass)
; playerMaxSize: Maximum size a player cell can achive before auto-splitting. (vanilla: mass = val*val/100 = 22500 mass)
; playerMinSplitSize: Mimimum size a player cell has to be to split. (vanilla: mass = val*val/100 = 36 mass)
; playerMinEjectSize: Minimum size a player cell has to be to eject mass. (vanilla: mass = val*val/100 = 32 mass)
; playerStartSize: Start size of the player cell. (vanilla: mass = val*val/100 = 10 mass)
; playerMaxCells: Maximum cells a player is allowed to have.
; playerFakeMaxCells: Maximum cells displayed to client (for x100 display, set to 100 while keeping playerMaxCells at 128)
; playerSpeed: Player speed multiplier (1 = normal speed, 2 = twice the normal speed)
; playerBoostDistance: Boost distance transfer multiplier when eating ejected mass (0 = no transfer, higher = more boost)
; playerBoostDirection: Boost direction transfer multiplier when eating ejected mass (0 = no direction transfer)
; playerRecombineTime: Base time in seconds before a cell is allowed to recombine (vanilla: 30 seconds)
; playerDecayRate: Amount of player cell size lost per second
; playerDecayCap: Maximum mass a cell can have before it's decayrate multiplies by 10. (0 to disable)
; playerDecayMax: Mass threshold where decay rate becomes 0.09 (when player total mass >= this value, decay = 0.09). Set to 0 to disable. Returns to normal when mass drops below threshold.
; playerNoMergeDelay1: First nomergedelay value (ticks) when player total mass >= playerNoMergeDelay1Mass
; playerNoMergeDelay1Mass: Mass threshold for first nomergedelay level
; playerNoMergeDelay2: Second nomergedelay value (ticks) when player total mass >= playerNoMergeDelay2Mass
; playerNoMergeDelay2Mass: Mass threshold for second nomergedelay level
; playerNoMergeDelay3: Third nomergedelay value (ticks) when player total mass >= playerNoMergeDelay3Mass
; playerNoMergeDelay3Mass: Mass threshold for third nomergedelay level
; playerDisconnectTime: Time in seconds before a disconnected player's cell is removed (Set to -1 to never remove)
; playerDeadDelay: Delay in ticks before dead cells are removed from view (0 = instant, 25 = 1 second)
; splitVelocity: Velocity of splitting cells (speed and distance)
; playerSplitDist: Initial distance offset when splitting cells (0 = no offset, relies only on boost velocity)
playerMinSize = 32
playerDecayRate = 0
playerMaxSize = 219500
playerMinSplitSize = 300
playerMinEjectSize = 130
playerNoEjectDelay = 10
playerCellSortingMassLimit = 10025252525000
playerStartSize = 1500
playerMaxCells = 100
playerSplitCap = 1
playerCollisionDelay = 10
playerCellSorting = 1
playerCellSortingAgeMult = 0.1
playerSpeed = 1.5
playerBoostTransferMultiplier = 0
playerBoostTransferReversed = 0
staticDecay = 0.5
localDecay = 15
globalDecay = 0.5
decayMin = 1500
playerRecombineTime = 0
playerMergeIncrease = 0
playerMergeNewVersion = false
playerNoMergeDelay = 12
playerNoMergeDelay1 = 12
playerNoMergeDelay1Mass = 100000
playerNoMergeDelay2 = 12
playerNoMergeDelay2Mass = 150000
playerNoMergeDelay3 = 12
playerNoMergeDelay3Mass = 200000
playerDecayMax = 215000
playerRespawnNearDeath = 0
playerRespawnNearDeathDistance = 600
playerAutoRespawn = 1
playerAutoRespawnTime = 0.6  # 0.6 saniye
playerMaxNickLength = 15
playerDisconnectTime = 0
playerDeadDelay = 125
splitVelocity = 780
playerSplitDist = 0
playerSpawnProtection = 100
useCenterOfMassCollision = 0
playerSplitReverseMass = 55000

; [MINIONS]
; Custom minion settings
; minionStartSize: Start size of minions (mass = val*val/100 = 10 mass)
; minionMaxStartSize: Maximum value of random start size for minions (set value higher than minionStartSize to enable)
; disableERTP: Whether or not to disable ERTP controls for minions. (must use ERTPcontrol script in /scripts) (Set to 0 to enable)
; disableQ: Whether or not to disable Q controls for minions. (Set 0 to enable)
; serverMinions: Amount of minions each player gets once they spawn
; collectPellets: Enable collect pellets mode for minions. To use, use the ERTPcontrol script and press "P"
; defaultName: Default name for all minions if name is not specified using command (put <r> before the name for random skins!)
minionStartSize = 31.6227766017
minionMaxStartSize = 31.6227766017
disableERTP = 1
disableQ = 0
serverMinions = 0
collectPellets = 0
defaultName = "minion"
